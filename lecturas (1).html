/* ============ FUNCIONES AUXILIARES ============ */
function lookup(rawWord, gloss){
  const clean = rawWord.toLowerCase().replace(/[^a-záéíóúñü']/gi,"");
  if(!clean) return null;
  if(gloss && gloss[clean]) return gloss[clean];
  if(FUNC[clean]) return FUNC[clean];
  // intentar quitar sufijos comunes
  const strip = [
    [/ies$/,"y"], [/es$/,""], [/s$/,""], [/ing$/,""], [/ed$/,""], [/ed$/,"e"], [/ing$/,"e"]
  ];
  for(const [pat, rep] of strip){
    if(pat.test(clean)){
      const base = clean.replace(pat, rep);
      if(gloss && gloss[base]) return gloss[base];
      if(FUNC[base]) return FUNC[base];
    }
  }
  return null;
}

function tokenize(text){
  // separa en palabras y signos de puntuación, preservando espacios
  return text.match(/[A-Za-z']+|[^A-Za-z']+/g) || [];
}

function buildTextHTML(entry, idx){
  const tokens = tokenize(entry.en);
  let html = "";
  tokens.forEach((tok, i)=>{
    if(/^[A-Za-z']+$/.test(tok)){
      html += `<span class="w" data-txt="${idx}" data-word="${tok.replace(/"/g,'&quot;')}">${tok}</span>`;
    } else {
      html += `<span class="punct">${tok.replace(/\\n/g,"<br>")}</span>`;
    }
  });
  return html;
}

/* ============ RENDER ============ */
const mainList = document.getElementById("mainList");
const emptyMsg = document.getElementById("emptyMsg");
const countNote = document.getElementById("countNote");
let currentLevel = "ALL";
let currentSearch = "";

function render(){
  mainList.innerHTML = "";
  const filtered = TEXTS
    .map((t,i)=>({...t, idx:i}))
    .filter(t => (currentLevel==="ALL" || t.level===currentLevel))
    .filter(t => t.title.toLowerCase().includes(currentSearch.toLowerCase()));

  countNote.textContent = `${filtered.length} texto(s) encontrados`;
  emptyMsg.style.display = filtered.length ? "none" : "block";

  filtered.forEach(entry=>{
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-head">
        <span class="tag ${entry.level}">Nivel ${entry.level}</span>
        <h3 class="card-title">${entry.title}</h3>
        <span class="chevron">▶</span>
      </div>
      <div class="card-body">
        <div class="text-block">${buildTextHTML(entry, entry.idx)}</div>
        <div class="toolbar">
          <button class="btn btn-translate">Traducción completa</button>
          <button class="btn btn-hide-word" style="display:none;">Ocultar palabra</button>
        </div>
        <div class="word-pop"></div>
        <div class="full-translation">${entry.es}</div>
      </div>
    `;
    mainList.appendChild(card);

    const head = card.querySelector(".card-head");
    head.addEventListener("click", ()=> card.classList.toggle("open"));

    const btnTranslate = card.querySelector(".btn-translate");
    const fullDiv = card.querySelector(".full-translation");
    btnTranslate.addEventListener("click", (e)=>{
      e.stopPropagation();
      fullDiv.classList.toggle("show");
      btnTranslate.textContent = fullDiv.classList.contains("show") ? "Ocultar traducción" : "Traducción completa";
    });

    const wordPop = card.querySelector(".word-pop");
    card.querySelectorAll(".w").forEach(span=>{
      span.addEventListener("click", (e)=>{
        e.stopPropagation();
        card.querySelectorAll(".w.picked").forEach(s=>s.classList.remove("picked"));
        span.classList.add("picked");
        const word = span.dataset.word;
        const translation = lookup(word, entry.gloss);
        wordPop.innerHTML = translation
          ? `<b>${word}</b> → ${translation}`
          : `<b>${word}</b> → (traducción no disponible; prueba con "Traducción completa")`;
        wordPop.classList.add("show");
      });
    });
  });
}

document.querySelectorAll(".lvl-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".lvl-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentLevel = btn.dataset.lvl;
    render();
  });
});

document.getElementById("searchBox").addEventListener("input", (e)=>{
  currentSearch = e.target.value;
  render();
});

render();
</script>
